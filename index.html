   <style>
      /* Main styling for John Singlepageington 
         WEB DEVELOPERS, WEB DEVELOPERS, WEB DEVELOPAHS!!! 
         Created by nitrate92. */

      /* Fonts */
      @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap');
      /* Fonts end */

      :root {
         --bg-color: #e9a5f1;
         --bg-color-alt: #8f87f1;
         --general-text: white;
         --main-padding: 35px;
         --upper-lower-padding: calc(50px - var(--main-padding));
      }

      body {
         margin: 0;
         padding-bottom: var(--upper-lower-padding);
         background-color: var(--bg-color);
         text-align: center;
         font-family: "Helvetica";
      }

      h1 {
         color: var(--general-text);
         font-size: 45px;
      }

      h2 {
         color: #eee;
      }

      p {
         color: var(--general-text);
         font-size: 20px;
         text-shadow: 1px 1px black;
      }

      a:link {
         font-size: 20px;
         color: var(--general-text);
         background-color: transparent;
         text-decoration: underline;
      }

      a:visited {
         color: var(--general-text);
         background-color: transparent;
         text-decoration: none;
      }

      a:hover {
         color: lightgray;
         transition: 0.25s ease;
      }

      a:active {
         color: blue;
         background-color: transparent;
         text-decoration: underline;
      }

      /* Main styling end */

      /* Other elements */
      table,
      th,
      td {
         border-collapse: collapse;
         text-align: center;
         color: var(--general-text);
      }

      ul {
         display: inline-block;
         text-align: left;
      }

      li {
         color: var(--general-text);
         text-shadow: 1px 1px black;
      }

      pre {
         color: var(--general-text);
         font-size: 18px;
         text-align: left;
         border-left: 5px solid var(--bg-color-alt);
      }

      /* Other elements end */

      /* Classes */
      .header {
         padding: 5px;
         background: var(--bg-color-alt);
         text-shadow: 1px 1px black;
      }

      .pfp {
         /* Round! */
         border-radius: 50%;
         padding: 0px;
         margin-top: var(--upper-lower-padding);
         /* Blur! 
            Use this in your own site: https://cssbud.com/css-generator/css-glow-generator/ */
         -webkit-box-shadow: 0px 0px 85px 45px rgba(255, 150, 218, 0.9);
         -moz-box-shadow: 0px 0px 85px 45px rgba(255, 150, 218, 0.9);
         box-shadow: 0px 0px 85px 45px rgba(255, 150, 218, 0.9);
      }

      .name {
         margin-top: 10px;
         margin-bottom: 5px;
      }

      .pronouns {
         margin-top: 0px;
      }

      .content {
         background: linear-gradient(180deg, var(--bg-color-alt) 0%, var(--bg-color) 100%);
         padding-top: 10px;
      }

      .roboto-mono-bitchin {
         font-family: "Roboto Mono", monospace;
         font-optical-sizing: auto;
         font-weight: 700;
         font-style: normal;
      }

      /* Try to comfortably fit to a 1080p screen, probably until there is enough content to force the page to vertically scroll on 1080p */
      .flex-thing {
         flex-wrap: wrap;
         margin-top: 20px;
         display: flex;
         justify-content: center;
      }

      .flex-thing>img {
         padding: 10px;
      }

      .tooltip {
         position: relative;
         display: inline-block;
         border-bottom: 1px dotted black;
         -webkit-user-select: none;
         -moz-user-select: none;
         user-select: none;
      }

      .tooltip .tooltiptext {
         visibility: hidden;
         opacity: 0;
         transition: opacity 250ms ease-in;
         background-color: black;
         color: #fff;
         text-align: center;
         border-radius: 6px;
         padding: 5px;
         width: max-content;

         /* Position the tooltip */
         position: absolute;
         z-index: 1;
         top: -5px;
         bottom: -5px;
         left: 105%;
      }

      .tooltip:hover .tooltiptext {
         visibility: visible;
         opacity: 1;
      }

      /* Classes end */
   </style>
</head>

</body>
